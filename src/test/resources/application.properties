spring.application.name=crm
db.url=jdbc:h2:mem:gymcrm;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
db.username=sa
db.password=
hibernate.dialect=org.hibernate.dialect.H2Dialect
hibernate.hbm2ddl.auto=create-drop
hibernate.show_sql=false
storage.init.trainees-file=classpath:trainees-data.txt
storage.init.trainers-file=classpath:trainers-data.txt
spring.profiles.active=local
security.jwt.secret=change-this-development-secret-at-least-32-bytes-long
security.jwt.expiration-minutes=60
spring.activemq.broker-url=vm://localhost?broker.persistent=false&broker.useJmx=false
messaging.trainer-workload.queue=trainer.workload.queue

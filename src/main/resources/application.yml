spring:
  application:
    name: gym-crm

  profiles:
    active: local

  activemq:
    broker-url: tcp://localhost:61616

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: gym-crm

security:
  jwt:
    secret: change-this-development-secret-at-least-32-bytes-long
    expiration-minutes: 60

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

messaging:
  trainer-workload:
    queue: trainer.workload.queue

spring:
  application:
    name: gym-crm

  profiles:
    active: local

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: gym-crm

security:
  jwt:
    secret: change-this-development-secret-at-least-32-bytes-long
    expiration-minutes: 60

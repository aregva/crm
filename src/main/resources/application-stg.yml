db:
  url: jdbc:h2:file:./data/gymcrm-stg
  username: sa
  password: ""

hibernate:
  dialect: org.hibernate.dialect.H2Dialect
  hbm2ddl:
    auto: validate
  show_sql: false

storage:
  init:
    trainees-file: classpath:trainees-data.txt
    trainers-file: classpath:trainers-data.txt

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus